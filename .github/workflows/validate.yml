name: Validate Public Starter

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the documented minimum; 3.13 is the newest version the suite is checked on.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - name: Build every supported projection in memory
        run: |
          python3 scripts/build_public_starter_data.py --language en
          python3 scripts/build_public_starter_data.py --language zh-CN
          python3 scripts/build_public_starter_data.py --personal-vault --language en
          python3 scripts/build_public_starter_data.py --personal-vault --language zh-CN
      - name: Check committed projection freshness
        run: python3 scripts/build_public_starter_data.py --check
      - name: Validate public boundaries and repository contracts
        run: |
          python3 scripts/validate_runtime_config.py
          python3 scripts/validate_task_extensions.py
          python3 scripts/validate_plugins.py
          python3 scripts/validate_agent_architecture.py
          python3 scripts/validate_evolution_control.py
          python3 scripts/validate_public_safety.py
          python3 scripts/validate_docs_bilingual.py
          python3 scripts/validate_positioning_consistency.py
          python3 scripts/validate_headless.py
          python3 scripts/validate_semantic_receipts.py
          python3 scripts/validate_plugin_standard.py
          python3 scripts/validate_release_metadata.py --expected-commit "$GITHUB_SHA" --require-clean
          python3 scripts/check_all_links.py
      - name: Run Python regression suite
        run: python3 -m unittest discover -s evals -p "test_*.py"
      - name: Check JavaScript syntax
        run: find dashboard -type f -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Run JavaScript regression suite
        run: |
          for file in evals/*.js; do
            node "$file"
          done
