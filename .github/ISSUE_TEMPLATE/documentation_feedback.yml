name: Documentation feedback
description: Report confusing, incomplete, or inconsistent documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Use this form for documentation clarity, onboarding, bilingual consistency, and public/private boundary issues.
  - type: input
    id: file
    attributes:
      label: File or page
      description: Which document were you reading?
      placeholder: "README.md, docs/user-manual.en.md, docs/system-reference.en.md"
    validations:
      required: true
  - type: textarea
    id: unclear
    attributes:
      label: What was unclear?
      description: Describe where you got stuck or what felt inconsistent.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to learn?
      description: What should the document have made easier?
  - type: dropdown
    id: language
    attributes:
      label: Documentation language
      options:
        - English
        - Chinese
        - Both / bilingual consistency
        - Not language-related
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or fix
      description: Optional. A short concrete suggestion is helpful.
  - type: checkboxes
    id: safety
    attributes:
      label: Public-safety check
      options:
        - label: I did not include private research material, personal data, secrets, or unpublished content.
          required: true
